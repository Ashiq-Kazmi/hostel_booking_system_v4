{% extends 'base.html' %}{% block title %}Add Hostel | HostelHub{% endblock %}{% block content %}<div class="card form-card"><h1>Add a hostel</h1><p class="muted">Listings are reviewed by an administrator before becoming public.</p><form method="post"><div class="form-group"><label>Hostel name</label><input name="name" required></div><div class="form-group"><label>Location</label><input name="location" required></div><div class="form-group"><label>Monthly price</label><input type="number" name="price" min="0" step="0.01" required></div><div class="form-group"><label>Available seats</label><input type="number" name="seats" min="0" required></div><div class="form-group"><label>Room type</label><select name="room_type" required><option>Single</option><option>Double</option><option>Shared</option></select></div><div class="form-group"><label>Distance from university (km)</label><input type="number" name="distance_km" min="0" step="0.01"></div><div class="form-group"><label>Image URL</label><input name="image_url" placeholder="https://..."></div><div class="form-group"><label>Map URL</label><input name="map_link" placeholder="https://maps.google.com/..."></div><div class="form-group"><label>Description</label><textarea name="description"></textarea></div><button class="btn">Submit listing</button></form></div>{% endblock %}
